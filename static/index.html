<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mekho</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <main class="container">

    <!-- Animated orb — drawn by app.js on a Canvas element.
         The orb reacts to mic/playback amplitude and changes color
         depending on the current assistant state. -->
    <canvas id="orb-canvas" aria-hidden="true"></canvas>

    <!-- Status line: "Press and hold to talk", "Thinking…", etc. -->
    <p id="status-text" class="status-text">Connecting…</p>

    <!-- What the user said (filled by "transcript" messages from the server) -->
    <p id="transcript-text" class="transcript-text"></p>

    <!-- Streamed assistant reply (filled sentence-by-sentence as audio plays) -->
    <p id="reply-text" class="reply-text"></p>

  </main>

  <!--
    Load order matters:
      1. ui.js   — defines UIController (must exist before app.js runs)
      2. app.js  — orchestration: WebSocket, recording, playback, canvas animation
    Both use defer so the DOM is fully parsed before either script executes.
  -->
  <!-- Cart sidebar — fixed to the right of the orb interface -->
  <aside id="cart-panel" class="cart" aria-label="Shopping cart">
    <header class="cart__header">
      <span class="cart__title">Cart</span>
      <span id="cart-badge" class="cart__badge" hidden>0</span>
    </header>
    <p id="cart-empty" class="cart__empty">No items yet</p>
    <ul id="cart-list" class="cart__list" role="list"></ul>
    <footer id="cart-total" class="cart__footer" hidden></footer>
  </aside>

  <!--
    Load order:
      1. onnxruntime-web  — WASM runtime needed by Silero VAD
      2. vad-web          — @ricky0123/vad-web (exposes global `vad`)
      3. ui.js / orb.js / audioPlayer.js / cart.js / app.js
    vad-web + ort are loaded *without* defer so they are ready before app.js runs.
  -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.wasm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.29/dist/bundle.min.js"></script>
  <script src="/static/ui.js"            defer></script>
  <script src="/static/orb.js"           defer></script>
  <script src="/static/audioPlayer.js"   defer></script>
  <script src="/static/vadController.js" defer></script>
  <script src="/static/cart.js"          defer></script>
  <script src="/static/app.js"           defer></script>
</body>
</html>
